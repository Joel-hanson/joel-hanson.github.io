<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-labelledby="title desc">
  <title id="title">Foldmark logo</title>
  <desc id="desc">Two dark folded bands with an orange triangular fold accent.</desc>
