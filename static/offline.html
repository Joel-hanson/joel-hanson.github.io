<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline · Joel Hanson</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --fg: #f5f5f5;
        --muted: #a3a3a3;
        --accent: #dc143c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 28rem;
        text-align: left;
      }
      .prompt {
        color: var(--accent);
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        color: var(--fg);
        border-bottom: 3px solid var(--accent);
        text-decoration: none;
      }
      a:hover,
      a:focus {
        background: #b91c3c;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="prompt">joel@portfolio:~$ offline</div>
      <h1>You're offline</h1>
      <p>
        This page isn't cached yet. Reconnect and try again — visited pages and
        site assets will load without a network once you've opened them.
      </p>
      <p><a href="/">← Back home</a></p>
    </main>
  </body>
</html>
