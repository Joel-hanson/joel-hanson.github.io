# -- Site Configuration --
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://joel-hanson.github.io/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false
buildExpired = false

enableEmoji = true

[pagination]
  pagerSize = 12

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 90
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 60

[services]
  [services.googleAnalytics]
    ID = "G-L6SPMXG29J"

[minify]
  disableXML = true
  minifyOutput = true
